<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Track 1: Sugar Alias Detective - Family Nutrition</title>

  <style>
    :root {
      --primary: #22c55e;
      --primary-dark: #16a34a;
      --bg: #f0f4f8;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
    }

    .badge-pill {
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      display: inline-block;
      margin-bottom: 12px;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-back {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }

    /* Label Hotspot Area */
    .label-box {
      background: #fffbe6;
      border: 2px dashed #f59e0b;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      text-align: left;
      line-height: 2.2;
      font-size: 16px;
    }

    .word {
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
      display: inline-block;
      user-select: none;
    }

    .word:hover {
      background: #fef08a;
    }

    .word.found {
      background: var(--primary) !important;
      color: white !important;
      font-weight: bold;
      transform: scale(1.05);
    }

    .word.wrong {
      background: #ef4444;
      color: white;
      animation: shake 0.3s;
    }

    #feedback {
      min-height: 48px;
      font-weight: 600;
      margin-top: 15px;
      line-height: 1.4;
    }

    .progress-bar {
      background: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-fill {
      background: var(--primary);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
  </style>
</head>
