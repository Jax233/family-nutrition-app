<script>
  // 1. Initialize Supabase Client safely
  const SUPABASE_URL = "https://sdikoeoysrrdwvrhgykd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_HcVz-d4a-evy9mRYMFDuxA_s-lhQshs";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadDashboard() {
    // 2. Check if User is Logged In
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    const userId = session.user.id;

    // 3. Fetch User Profile Data (XP and Streak)
    const { data: profile, error: profileErr } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', userId)
      .single();

    if (profile) {
      document.getElementById('userDisplayName').innerText = profile.display_name || "Welcome Family!";
      document.getElementById('userRole').innerText = (profile.role === 'child' ? 'Child Profile' : 'Parent Account');
      document.getElementById('totalXP').innerText = profile.total_xp || 0;
      document.getElementById('currentStreak').innerText = (profile.current_streak || 0) + " Days";
    }

    // 4. Fetch User Game Scores & Unlock Badges
    const { data: scores, error: scoresErr } = await supabaseClient
      .from('user_game_scores')
      .select('badge_earned')
      .eq('user_id', userId);

    if (scoresErr) {
      console.error("Error loading scores/badges:", scoresErr);
    }

    if (scores && scores.length > 0) {
      scores.forEach(item => {
        // Unlock Alias Detective Badge
        if (item.badge_earned === 'Alias Detective') {
          const badgeEl = document.getElementById('badge-alias');
          if (badgeEl) badgeEl.classList.add('unlocked');
        }
        
        // Unlock Traffic Light Badge
        if (item.badge_earned === 'Traffic Light Pro') {
          const badgeEl = document.getElementById('badge-traffic');
          if (badgeEl) badgeEl.classList.add('unlocked');
        }
        
        // Unlock Real Food Champion Badge (Track 2)
        if (item.badge_earned === 'Real Food Champion') {
          const badgeEl = document.getElementById('badge-upf');
          if (badgeEl) badgeEl.classList.add('unlocked');
        }
      });
    }
  }

  async function logout() {
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  }

  loadDashboard();
</script>
