<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Nutrition Platform</title>
  
  <meta http-equiv="refresh" content="0; url=login.html" />
  
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .redirect-card {
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      max-width: 360px;
      width: 90%;
    }
    .spinner {
      border: 4px solid #e2e8f0;
      border-top: 4px solid #22c55e;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 8px 0;
      color: #1e293b;
      font-size: 20px;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .btn-redirect {
      display: inline-block;
      background: #22c55e;
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-redirect:hover {
      background: #16a34a;
    }
  </style>
  
  <script>
    // JS Fallback Redirect
    window.location.href = "login.html";
  </script>
</head>
<body>

  <div class="redirect-card">
    <div class="spinner"></div>
    <h2>Redirecting to Sign In...</h2>
    <p>If you are not automatically redirected, please click the button below.</p>
    <a href="login.html" class="btn-redirect">Go to Login Page</a>
  </div>

</body>
</html>
